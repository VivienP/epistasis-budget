name: ci

# Mirror of the local gate (scripts/hooks/pre-commit for lint and types, scripts/hooks/pre-push for the
# offline suite): the same checks, run in the shared GitHub environment so a clone, a --no-verify on
# another machine, or a contributor cannot land lint/type/test regressions silently. Keep this a MIRROR —
# the same commands, never a superset — so local and CI cannot diverge. Offline only: no ESM-2 download,
# no data fetch (the slow/data markers stay excluded, matching the offline-tests skill).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same ref makes the previous run obsolete; cancel it instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and lint need no project dependencies, so they answer in seconds instead of waiting behind
  # the Torch install. Split out of the gate job rather than duplicated: ruff runs exactly once.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff==0.16.0"

      - name: ruff format --check
        run: ruff format --check src/ tests/ scripts/

      - name: ruff check
        run: ruff check src/ tests/ scripts/

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # The gate is CPU-only, but the default PyPI Torch wheel drags in ~2.5 GB of CUDA runtime it never
      # loads. Installing the CPU build first makes the extras resolve against the wheel already present.
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Restore mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('src/**/*.py', 'pyproject.toml') }}
          restore-keys: mypy-${{ runner.os }}-py3.12-

      - name: mypy --strict
        run: mypy --strict src/

      # Fixed worker count, not `-n auto`: every worker imports Torch, and one process per core exhausts
      # memory on a high-core machine. Distribute by file — the suite is independent per module, not per test.
      - name: pytest (offline)
        run: pytest -m "not slow and not data" -n 4 --dist loadfile

      - name: artifact claims
        run: python scripts/validate_artifacts.py
